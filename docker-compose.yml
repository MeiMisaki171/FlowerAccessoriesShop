version: '3.8'

services:
  app:
    build: .
    container_name: nest_app
    ports:
      - '3000:3000'
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=namnt123
      - DB_NAME=FlowerAccessoriesShop
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server
    ports:
      - '1433:1433'
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=namnt123
    volumes:
      - sqlserverdata:/var/opt/mssql

volumes:
  sqlserverdata:
